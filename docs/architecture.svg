<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="840" viewBox="0 0 1720 840" font-family="Inter, Segoe UI, DejaVu Sans, Helvetica, sans-serif">

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#9aa3ae"/>
    </marker>
    <marker id="arwd" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b8823a"/>
    </marker>
  </defs>

  <rect width="1720" height="840" fill="#ffffff"/>

  <!-- ===== header ===== -->
  <text x="60" y="52" font-size="27" font-weight="700" fill="#111827">AI Inbound Lead Engine</text>
  <text x="60" y="82" font-size="15" fill="#6b7280">Form submission to qualified, human-approved reply in under 4 seconds</text>
  <text x="1660" y="52" font-size="13" fill="#9aa3ae" text-anchor="end">n8n · PostgreSQL · LLM scoring</text>
  <line x1="60" y1="104" x2="1660" y2="104" stroke="#e6e9ee" stroke-width="1"/>

  <!-- ===== pipeline boxes ===== -->
  <g>
    <!-- 1 -->
    <rect x="60" y="150" width="170" height="92" rx="9" fill="#f8f9fb" stroke="#d4d8de"/>
    <text x="76" y="177" font-size="12" font-weight="700" fill="#9aa3ae">01</text>
    <text x="76" y="201" font-size="17" font-weight="600" fill="#1f2937">Intake</text>
    <text x="76" y="223" font-size="12.5" fill="#6b7280">Signed webhook</text>
    <!-- 2 -->
    <rect x="266" y="150" width="170" height="92" rx="9" fill="#f8f9fb" stroke="#d4d8de"/>
    <text x="282" y="177" font-size="12" font-weight="700" fill="#9aa3ae">02</text>
    <text x="282" y="201" font-size="17" font-weight="600" fill="#1f2937">Dedupe</text>
    <text x="282" y="223" font-size="12.5" fill="#6b7280">Atomic UPSERT</text>
    <!-- 3 -->
    <rect x="472" y="150" width="170" height="92" rx="9" fill="#f8f9fb" stroke="#d4d8de"/>
    <text x="488" y="177" font-size="12" font-weight="700" fill="#9aa3ae">03</text>
    <text x="488" y="201" font-size="17" font-weight="600" fill="#1f2937">Hard filter</text>
    <text x="488" y="223" font-size="12.5" fill="#6b7280">Class + MX check</text>
    <!-- 4 -->
    <rect x="678" y="150" width="170" height="92" rx="9" fill="#f8f9fb" stroke="#d4d8de"/>
    <text x="694" y="177" font-size="12" font-weight="700" fill="#9aa3ae">04</text>
    <text x="694" y="201" font-size="17" font-weight="600" fill="#1f2937">Enrich</text>
    <text x="694" y="223" font-size="12.5" fill="#6b7280">Site to text</text>
    <!-- 5 -->
    <rect x="884" y="150" width="170" height="92" rx="9" fill="#f1f4fb" stroke="#c3ccdf"/>
    <text x="900" y="177" font-size="12" font-weight="700" fill="#9aa3ae">05</text>
    <text x="900" y="201" font-size="17" font-weight="600" fill="#1f2937">Score</text>
    <text x="900" y="223" font-size="12.5" fill="#6b7280">LLM rubric, temp 0</text>
    <!-- 6 -->
    <rect x="1090" y="150" width="170" height="92" rx="9" fill="#f8f9fb" stroke="#d4d8de"/>
    <text x="1106" y="177" font-size="12" font-weight="700" fill="#9aa3ae">06</text>
    <text x="1106" y="201" font-size="17" font-weight="600" fill="#1f2937">Route</text>
    <text x="1106" y="223" font-size="12.5" fill="#6b7280">Five outcomes</text>
  </g>

  <!-- arrows between pipeline boxes -->
  <g stroke="#9aa3ae" stroke-width="1.6" marker-end="url(#arw)" fill="none">
    <line x1="230" y1="196" x2="258" y2="196"/>
    <line x1="436" y1="196" x2="464" y2="196"/>
    <line x1="642" y1="196" x2="670" y2="196"/>
    <line x1="848" y1="196" x2="876" y2="196"/>
    <line x1="1054" y1="196" x2="1082" y2="196"/>
  </g>

  <!-- ===== failure annotations ===== -->
  <g font-size="12.2" fill="#a06a1f">
    <line x1="145" y1="242" x2="145" y2="272" stroke="#e0cba8" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="76" y="292">Bad HMAC signature</text>
    <text x="76" y="309">→ rejected, alerted</text>

    <line x1="351" y1="242" x2="351" y2="272" stroke="#e0cba8" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="282" y="292">Retried delivery</text>
    <text x="282" y="309">→ stop, no 2nd email</text>

    <line x1="557" y1="242" x2="557" y2="272" stroke="#e0cba8" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="488" y="292">No MX, disposable</text>
    <text x="488" y="309">→ REJECTED at $0</text>

    <line x1="763" y1="242" x2="763" y2="272" stroke="#e0cba8" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="694" y="292">Site down, WAF, SPA</text>
    <text x="694" y="309">→ degrade, still scored</text>

    <line x1="969" y1="242" x2="969" y2="272" stroke="#e0cba8" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="900" y="292">Bad JSON, injection,</text>
    <text x="900" y="309">low confidence → MANUAL</text>

    <line x1="1175" y1="242" x2="1175" y2="272" stroke="#e0cba8" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="1106" y="292">Unknown route</text>
    <text x="1106" y="309">→ fallback branch</text>
  </g>

  <!-- ===== outcomes ===== -->
  <g>
    <path d="M1260 196 H1300" stroke="#9aa3ae" stroke-width="1.6" fill="none"/>
    <path d="M1300 196 V118 H1322" stroke="#9aa3ae" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
    <path d="M1300 196 V182 H1322" stroke="#9aa3ae" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
    <path d="M1300 196 H1322" stroke="#9aa3ae" stroke-width="1.6" fill="none" marker-end="url(#arw)" opacity="0"/>
    <path d="M1300 196 V246 H1322" stroke="#9aa3ae" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
    <path d="M1300 196 V310 H1322" stroke="#9aa3ae" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
    <path d="M1300 196 V374 H1322" stroke="#9aa3ae" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>

    <rect x="1330" y="92" width="330" height="52" rx="8" fill="#fdf3f3" stroke="#e8c4c4"/>
    <rect x="1330" y="92" width="4" height="52" rx="2" fill="#d1453f"/>
    <text x="1350" y="115" font-size="14.5" font-weight="600" fill="#8f2f2b">HOT</text>
    <text x="1408" y="115" font-size="13" fill="#6b7280">Slack card with draft reply</text>
    <text x="1350" y="134" font-size="12" fill="#9aa3ae">score 8-10, high confidence</text>

    <rect x="1330" y="156" width="330" height="52" rx="8" fill="#fdf8f0" stroke="#e8d5b8"/>
    <rect x="1330" y="156" width="4" height="52" rx="2" fill="#c9822a"/>
    <text x="1350" y="179" font-size="14.5" font-weight="600" fill="#8a5a1b">WARM</text>
    <text x="1420" y="179" font-size="13" fill="#6b7280">Airtable nurture queue</text>
    <text x="1350" y="198" font-size="12" fill="#9aa3ae">score 5-7</text>

    <rect x="1330" y="220" width="330" height="52" rx="8" fill="#f2f7fb" stroke="#c4d7e6"/>
    <rect x="1330" y="220" width="4" height="52" rx="2" fill="#2f7ba8"/>
    <text x="1350" y="243" font-size="14.5" font-weight="600" fill="#1f5c80">COLD</text>
    <text x="1414" y="243" font-size="13" fill="#6b7280">Polite decline, sent automatically</text>
    <text x="1350" y="262" font-size="12" fill="#9aa3ae">score 0-4</text>

    <rect x="1330" y="284" width="330" height="52" rx="8" fill="#f6f3fb" stroke="#d5c9e8"/>
    <rect x="1330" y="284" width="4" height="52" rx="2" fill="#6d4aa8"/>
    <text x="1350" y="307" font-size="14.5" font-weight="600" fill="#4e3480">MANUAL</text>
    <text x="1442" y="307" font-size="13" fill="#6b7280">Slack review channel</text>
    <text x="1350" y="326" font-size="12" fill="#9aa3ae">red flags or low confidence</text>

    <rect x="1330" y="348" width="330" height="52" rx="8" fill="#f6f7f8" stroke="#dcdfe4"/>
    <rect x="1330" y="348" width="4" height="52" rx="2" fill="#8b929b"/>
    <text x="1350" y="371" font-size="14.5" font-weight="600" fill="#5b626b">REJECTED</text>
    <text x="1452" y="371" font-size="13" fill="#6b7280">Logged only, no action</text>
    <text x="1350" y="390" font-size="12" fill="#9aa3ae">never reaches the model</text>
  </g>

  <!-- ===== persistence bar ===== -->
  <rect x="60" y="352" width="1200" height="52" rx="8" fill="#f4f6f9" stroke="#dfe3e9"/>
  <text x="80" y="375" font-size="14" font-weight="600" fill="#374151">Every lead persisted</text>
  <text x="80" y="393" font-size="12.5" fill="#6b7280">app.leads — score, reasons, route, enrichment status, latency, token usage</text>
  <text x="1240" y="384" font-size="12.5" fill="#9aa3ae" text-anchor="end">makes the case study measurable</text>

  <!-- ===== human in the loop band ===== -->
  <rect x="60" y="454" width="1600" height="150" rx="11" fill="#fbfaf6" stroke="#e4dfd0"/>
  <text x="86" y="484" font-size="16" font-weight="700" fill="#7a6524">Human-in-the-loop — nothing is sent automatically to a hot lead</text>

  <rect x="86" y="500" width="330" height="76" rx="8" fill="#ffffff" stroke="#ddd8c8"/>
  <text x="106" y="527" font-size="14.5" font-weight="600" fill="#1f2937">Slack card</text>
  <text x="106" y="548" font-size="12.5" fill="#6b7280">Score, reasons, likely pain,</text>
  <text x="106" y="565" font-size="12.5" fill="#6b7280">draft opener grounded in stated facts</text>

  <path d="M416 538 H452" stroke="#b8823a" stroke-width="1.8" fill="none" marker-end="url(#arwd)"/>

  <rect x="460" y="500" width="330" height="76" rx="8" fill="#ffffff" stroke="#ddd8c8"/>
  <text x="480" y="527" font-size="14.5" font-weight="600" fill="#1f2937">Manager clicks Approve</text>
  <text x="480" y="548" font-size="12.5" fill="#6b7280">HMAC-signed link, 24h expiry,</text>
  <text x="480" y="565" font-size="12.5" fill="#6b7280">signature covers the expiry too</text>

  <path d="M790 538 H826" stroke="#b8823a" stroke-width="1.8" fill="none" marker-end="url(#arwd)"/>

  <rect x="834" y="500" width="330" height="76" rx="8" fill="#ffffff" stroke="#ddd8c8"/>
  <text x="854" y="527" font-size="14.5" font-weight="600" fill="#1f2937">Reply sent, once only</text>
  <text x="854" y="548" font-size="12.5" fill="#6b7280">State checked before sending;</text>
  <text x="854" y="565" font-size="12.5" fill="#6b7280">a replayed link reports already sent</text>

  <text x="1200" y="527" font-size="13" fill="#8a7440">Total time under a minute,</text>
  <text x="1200" y="546" font-size="13" fill="#8a7440">against four to eight hours</text>
  <text x="1200" y="565" font-size="13" fill="#8a7440">of manual handling.</text>

  <!-- dashed connector from HOT to the band -->
  <path d="M1660 118 H1692 V430 H700 V446" stroke="#c9a86a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arwd)"/>

  <!-- ===== footer ===== -->
  <line x1="60" y1="648" x2="1660" y2="648" stroke="#e6e9ee" stroke-width="1"/>

  <rect x="60" y="672" width="516" height="72" rx="8" fill="#fafbfc" stroke="#e3e6ea"/>
  <text x="82" y="700" font-size="14" font-weight="600" fill="#374151">Failure handling</text>
  <text x="82" y="722" font-size="12.5" fill="#6b7280">Any workflow failure posts to Slack and logs to</text>
  <text x="82" y="738" font-size="12.5" fill="#6b7280">app.workflow_errors with a link to the execution</text>

  <rect x="602" y="672" width="516" height="72" rx="8" fill="#fafbfc" stroke="#e3e6ea"/>
  <text x="624" y="700" font-size="14" font-weight="600" fill="#374151">Cost control</text>
  <text x="624" y="722" font-size="12.5" fill="#6b7280">19% of traffic is filtered before any paid call.</text>
  <text x="624" y="738" font-size="12.5" fill="#6b7280">Page text truncated to 5,000 characters.</text>

  <rect x="1144" y="672" width="516" height="72" rx="8" fill="#fafbfc" stroke="#e3e6ea"/>
  <text x="1166" y="700" font-size="14" font-weight="600" fill="#374151">Measured</text>
  <text x="1166" y="722" font-size="12.5" fill="#6b7280">4,555 ms average for scored leads.</text>
  <text x="1166" y="738" font-size="12.5" fill="#6b7280">Zero unhandled failures across the fixture suite.</text>

  <text x="60" y="790" font-size="12" fill="#aab0b8">Self-initiated demo project · obolentsev.dev</text>
</svg>
